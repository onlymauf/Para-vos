<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mensajes Motivacionales Diarios</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      max-width: 600px;
      margin: auto;
      text-align: center;
      background: #f0f8ff;
      color: #333;
    }
    h1 {
      color: #007acc;
    }
    h2 {
      color: #005a99;
      margin-top: 10px;
    }
    #mensaje {
      font-size: 1.6rem;
      margin: 30px 0;
      min-height: 80px;
    }
    .playlist-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 1.15rem;
      color: #007acc;
      text-decoration: underline;
      background: #e6f2fa;
      padding: 8px 16px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .playlist-link:hover {
      background: #d0eaff;
    }
    footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Tu mensaje motivacional</h1>
  <h2>Bienvenido Jose Manuel, me llamo Manuel y preparé esto para ti...</h2>
  <p id="mensaje">Cargando mensaje...</p>

  <h2>Escucha esta música y disfruta del día. ¡Eres mucho más de lo que piensas!</h2>
  <a id="playlist-link" class="playlist-link" href="#" target="_blank" rel="noopener">
    Ver playlist del día en YouTube Music
  </a>

  <footer>
    <p>Mensajes actualizados automáticamente según el día y la hora.</p>
  </footer>

          viernes: [
            "Termina la semana con gratitud y fuerza.",
            "Lo que haces hoy crea tu futuro.",

          ]
        },
        {
          lunes: [
            "La motivación es el primer paso, el hábito es el camino.",
            "No temas a los desafíos, son oportunidades disfrazadas.",
            "Cada día es una página en blanco, escribe una buena historia."
          ],
          martes: [
            "El éxito no es para los que piensan en rendirse.",
            "Transforma tus sueños en metas con acción diaria.",
            "La constancia es la clave del progreso."
          ],
          miércoles: [
            "No mires el reloj, haz que el tiempo cuente.",
            "Las grandes cosas toman tiempo, sigue adelante.",
            "El esfuerzo de hoy es la recompensa de mañana."
          ],
          jueves: [
            "Sé la energía que quieres atraer.",
            "El poder está en tus manos, úsalo con sabiduría.",
            "Cada pequeño avance es una victoria."
          ],
          viernes: [
            "La gratitud convierte lo que tenemos en suficiente.",
            "Termina la semana con una sonrisa y esperanza.",
            "El éxito es la suma de pequeños esfuerzos diarios."
          ]
        },
        {
          lunes: [
            "Empieza la semana con determinación y pasión.",
            "No dejes que el miedo te detenga.",
            "Cada intento te acerca más al éxito."
          ],
          martes: [
            "La disciplina supera a la motivación cuando esta falla.",
            "Cree en tu potencial ilimitado.",
            "El único límite eres tú mismo."
          ],
          miércoles: [
            "Haz hoy lo que otros no harán para tener mañana lo que otros no tienen.",
            "La perseverancia abre puertas que nadie más puede.",
            "No te compares, compite contigo mismo."
          ],
          jueves: [
            "El éxito es la suma de decisiones correctas.",
            "No esperes, crea tu oportunidad.",
            "Cada día es una nueva batalla, lucha con valentía."
          ],
          viernes: [
            "Celebra cada pequeño logro con orgullo.",
            "La actitud positiva atrae resultados positivos.",
            "Termina la semana siendo mejor que el lunes."
          ]
        },
        {
          lunes: [
            "El poder de hoy es la base del mañana.",
            "No te rindas, lo mejor está por llegar.",

          ],
          martes: [
            "No sueñes tu vida, vive tu sueño.",
            "Cada esfuerzo suma, no lo subestimes.",
            "La mente es tu mejor aliada, aliméntala bien."
          ],
          miércoles: [
            "El éxito es para los que persisten.",
            "No pares hasta estar orgulloso.",
            "Tus límites solo existen en tu mente."
          ],
          jueves: [
            "El cambio empieza con un pequeño paso.",
            "La acción es la clave para cualquier logro.",
            "Haz que cada día cuente."
          ],
          viernes: [
            "Termina la semana con gratitud y motivación.",
            "El futuro pertenece a los que creen en sus sueños.",
            "Sigue adelante, el esfuerzo vale la pena."
          ]
        }
      ];

      const playlistsPorDia = {
        lunes: "PLcGjkt7K1LMI-ellNC9xruNLL_2Sk6_xX",
        martes: "RDCLAK5uy_kkmAOU1_LO0Iv5bAPK0c-LccQja1U-J0o",
        miércoles: "PLVN-ncAeAX-eI9x76vNFTCsqrWMNeyG-Y",
        jueves: "RDCLAK5uy_l2pHac-aawJYLcesgTf67gaKU-B9ekk1o",
        viernes: "RDCLAK5uy_lb7VDK_LmS27Rd86TqVy7vNM6ijcOIEkc"
      };

      function obtenerSemana() {
        const ahora = new Date();
        const inicio = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() - ahora.getDay() + 1);
        const diffDias = Math.floor((ahora - inicio) / (1000 * 60 * 60 * 24));
        const semana = Math.floor(diffDias / 7);
        return semana < 4 ? semana : 3;
      }

      function obtenerMensaje() {
        const ahora = new Date();
        const dias = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
        const dia = dias[ahora.getDay()];
        const hora = ahora.getHours();

        if (!["lunes", "martes", "miércoles", "jueves", "viernes"].includes(dia)) {
          return "Disfruta tu fin de semana y recarga energías para la próxima semana.";
        }

        const semana = obtenerSemana();
        const mensajesSemana = mensajes[semana];
        if (!mensajesSemana[dia]) {
          return "Mantente motivado y positivo.";
        }

        let indiceMensaje;
        if (hora >= 6 && hora < 12) indiceMensaje = 0;
        else if (hora >= 12 && hora < 17) indiceMensaje = 1;
        else if (hora >= 17 && hora < 22) indiceMensaje = 2;
        else return "Descansa y prepárate para un nuevo día motivador.";

        return mensajesSemana[dia][indiceMensaje];
      }

      function cargarPlaylistLink() {
        const dias = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
        const dia = dias[new Date().getDay()];
        const playlistId = playlistsPorDia[dia] || playlistsPorDia["lunes"];
        const link = document.getElementById("playlist-link");
        link.href = `https://music.youtube.com/playlist?list=${playlistId}`;
      }

      // Actualiza el mensaje y el link de la playlist cuando el DOM esté listo
      document.getElementById("mensaje").textContent = obtenerMensaje();
      cargarPlaylistLink();
    });
  </script>
</body>
</html>
